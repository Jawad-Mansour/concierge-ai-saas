# Owner: Charbel

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Lint (ruff)
        run: |
          uvx ruff check . \
            --extend-exclude "infra" \
            --extend-exclude "widget" \
            --extend-exclude "demo" \
            --extend-exclude "admin" \
            --extend-exclude ".github"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build all images
        env:
          DOCKER_BUILDKIT: "1"
        run: docker compose build

