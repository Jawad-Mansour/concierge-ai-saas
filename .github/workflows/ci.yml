# Owner: Charbel

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Lint (ruff)
        run: |
          uvx ruff check . \
            --extend-exclude "infra" \
            --extend-exclude "widget" \
            --extend-exclude "demo" \
            --extend-exclude "admin" \
            --extend-exclude ".github"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        env:
          DOCKER_BUILDKIT: "1"
        run: docker compose build

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install deps
        run: uv sync --dev
        working-directory: backend

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short -m "not integration"
        working-directory: backend
