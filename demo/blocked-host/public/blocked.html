<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concierge Demo — Blocked Host</title>
</head>
<body>
  <h1>Blocked Host (localhost:8090)</h1>
  <p>This page is NOT in <code>allowed_origins</code>. The widget token request
     will return 403.</p>
  <p>The page's own CSP (<code>script-src 'none'</code>) also blocks widget.js
     from executing — DevTools Console shows the violation.</p>
  <div id="concierge-widget"></div>
  <script
    src="http://localhost:8000/widget.js"
    data-widget-id="WIDGET_ID_PLACEHOLDER">
  </script>
</body>
</html>
