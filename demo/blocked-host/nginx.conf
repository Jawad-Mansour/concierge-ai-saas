# Owner: Charbel

server {
    listen 80;
    root /usr/share/nginx/html;
    index blocked.html;

    # Strict CSP: blocks all scripts and frames — demonstrates that the
    # Concierge widget cannot load on an origin that sets this policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; frame-src 'none'" always;

    location / {
        try_files $uri $uri/ /blocked.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
