# OpenAPI 3.1 component schemas shared by /predict.
# Authoritative against data-model.md; the Pydantic v2 models in
# modelserver/app/schemas.py mirror this file. PRs that change one
# without changing the other are rejected in review.

openapi: 3.1.0
info:
  title: Classifier Service — shared component schemas
  version: 1.0.0

components:
  securitySchemes:
    ServiceCredential:
      type: http
      scheme: bearer
      description: |
        Vault-issued service credential. The classifier validates the token in
        constant time against the credential fetched at boot and rejects every
        invalid request with HTTP 401 and a fixed body — see Principle V and
        spec FR-004. The 401 body is identical for missing, expired, and otherwise
        invalid credentials.

  schemas:

    TenantId:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      minLength: 1
      maxLength: 64
      description: |
        Opaque tenant identifier. Used only for tracing and rate-limiting
        attribution; MUST NOT influence the prediction (spec FR-006 / SC-008).

    IntentClass:
      type: string
      enum: [SPAM, FAQ, CONTACT_LEAD, HARD_QUESTION, UNKNOWN]
      description: |
        Closed five-class vocabulary. Adding a class is a model-version change
        handled through the same evaluation-gated rollout path as any other
        model update (spec Assumptions).

    ModelHash:
      type: string
      pattern: '^[0-9a-f]{12}$'
      description: |
        12-character lowercase-hex truncation of the SHA-256 of the loaded
        model artifact. Constant for the process lifetime. Lets any production
        prediction be traced back to a specific artifact (spec FR-011 / SC-004).

    PredictRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, message]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        message:
          type: string
          minLength: 1
          maxLength: 16384
          description: |
            The visitor's incoming message. An empty or whitespace-only
            message is rejected at validation (HTTP 422), per the spec
            edge case "empty or whitespace-only message text". No inference
            hints, no version pins, no client-controlled steering.

    PredictResponse:
      type: object
      additionalProperties: false
      required: [predicted_class, confidence, model_hash]
      description: |
        Structural facts only. MUST NOT carry the original message, any
        substring of it, or a debug "input preview" field. Keeps the
        classifier from becoming an unintended content sink.
      properties:
        predicted_class:
          $ref: '#/components/schemas/IntentClass'
        confidence:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: |
            Reserved meaning: confidence == 0.0 means the response is the
            timeout-degraded fallback — inference exceeded the 200ms hard
            timeout, raised, or hit an unexpected internal exception.
            confidence > 0.0 with predicted_class == UNKNOWN means the model
            evaluated normally but max(predict_proba) fell below the
            UNKNOWN-escalation threshold.
            See spec edge case "Confidence reported as exactly zero".
        model_hash:
          $ref: '#/components/schemas/ModelHash'

    UnauthenticatedResponse:
      type: object
      additionalProperties: false
      required: [detail]
      description: |
        Returned with HTTP 401 for every missing/expired/invalid credential.
        Body is identical across the three cases — no information leak
        (spec FR-004).
      properties:
        detail:
          type: string
          enum: ["unauthenticated"]

    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      description: |
        Returned with HTTP 422 for malformed requests (missing required field,
        empty message, body too long). Structured; no partial prediction
        (spec FR-005).
      properties:
        detail:
          type: array
          description: FastAPI/Pydantic standard validation error array.
          items:
            type: object
