# Owner: Ali

# Redis config for Concierge short-term chat memory.
# This is local/docker-friendly; production secrets/network policy are owned by infra.

bind 0.0.0.0
port 6379
protected-mode no

timeout 0
tcp-keepalive 300

databases 16

# Memory is a privacy-sensitive cache, not permanent conversation storage.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Keep local restarts useful without treating Redis as the source of truth.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

loglevel notice
