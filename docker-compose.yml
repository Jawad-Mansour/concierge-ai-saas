# Owner: Shared

x-vault-env: &vault-env
  VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
  VAULT_TOKEN: ${VAULT_TOKEN:-dev-token}

services:

  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    build: ./infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-concierge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vault:
    image: hashicorp/vault:1.15
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  vault-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-token}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/concierge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-replace-me}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-replace-me}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-replace-me}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-replace-me}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3001}
    volumes:
      - ./infra/vault/seed.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]
    restart: "no"

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/postgres}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-nextauth-secret-change-in-prod}
      SALT: ${LANGFUSE_SALT:-dev-salt-change-in-prod}
      LANGFUSE_TELEMETRY_ENABLED: "false"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Application Services ────────────────────────────────────
  backend:
    build: ./backend
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *vault-env
      VAULT_ADDR: http://vault:8200
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/concierge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  modelserver:
    build: ./modelserver
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      <<: *vault-env
      VAULT_ADDR: http://vault:8200
    ports:
      - "${MODELSERVER_PORT:-8001}:8001"
    volumes:
      - ./modelserver/app:/app/app
      # Defense-in-depth: artifacts live in the image; mounting RO ensures a
      # mistakenly mutable mount can't replace the SHA-verified artifact at runtime.
      - ./modelserver/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  guardrails:
    build: ./guardrails
    # Two workers per research.md Decision 3 open risk "Tail latency under burst load".
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "2"]
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      <<: *vault-env
      VAULT_ADDR: http://vault:8200
      GUARDRAILS_SERVICE_CREDENTIAL: ${GUARDRAILS_SERVICE_CREDENTIAL:-}
    ports:
      - "${GUARDRAILS_PORT:-8002}:8002"
    volumes:
      - ./guardrails/app:/app/app
      # Configs hash-locked at build time; RO mount is defense-in-depth.
      - ./guardrails/config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin:
    build: ./admin
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      <<: *vault-env
      VAULT_ADDR: http://vault:8200
      API_URL: http://backend:8000
    ports:
      - "${ADMIN_PORT:-8501}:8501"
    volumes:
      - ./admin:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  widget:
    build: ./widget
    ports:
      - "${WIDGET_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Demo Pages ──────────────────────────────────────────────
  demo-host:
    build: ./demo/host
    ports:
      - "${DEMO_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-blocked-host:
    build: ./demo/blocked-host
    ports:
      - "${DEMO_BLOCKED_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
