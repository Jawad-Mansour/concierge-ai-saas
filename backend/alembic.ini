# Owner: Mohammad

[alembic]
script_location = ../infra/postgres/migrations
version_locations = %(script_location)s
prepend_sys_path = .

# DATABASE_URL is injected by env.py from the Vault-fetched value at startup.
# For CLI use: set DATABASE_URL env var before running alembic commands.
# Example: DATABASE_URL=postgresql+psycopg2://user:pass@localhost:5432/concierge alembic upgrade head
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
