# Owner: Ali

[project]
name = "concierge-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "hvac>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.4",
]

[tool.ruff]
exclude = [
    "infra",
    "widget",
    "demo",
    "admin",
    ".github",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as requiring the live docker compose stack",
]
