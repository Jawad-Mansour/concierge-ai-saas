# Owner: Ali

[project]
name = "concierge-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "hvac>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "redis>=5.0",
    "minio>=7.2",
    "email-validator>=2.1",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.ruff]
exclude = [
    "infra",
    "widget",
    "demo",
    "admin",
    ".github",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: marks tests as requiring the live docker compose stack",
]
