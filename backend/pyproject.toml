# Owner: Ali

[project]
name = "concierge-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "hvac>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "redis>=5.0",
    "minio>=7.2",
]

[dependency-groups]
dev = ["ruff>=0.4"]

[tool.ruff]
exclude = [
    "infra",
    "widget",
    "demo",
    "admin",
    ".github",
]
